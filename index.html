            let data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
            
            if (data.action === 'saveData') {
                localStorage.setItem(data.key, JSON.stringify(data.payload));
            } 
            else if (data.action === 'loadData') {
                let saved = localStorage.getItem(data.key);
                let response = { action: 'returnData', key: data.key, payload: saved ? JSON.parse(saved) : null };
                
                // Balas langsung ke pengetuk
                if (event.source) event.source.postMessage(JSON.stringify(response), '*');
            }
            else if (data.action === 'deleteData') {
                localStorage.removeItem(data.key);
            }
        } catch(e) {}
    });
</script>
</html>
