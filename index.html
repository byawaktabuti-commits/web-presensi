<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <!-- Pengaturan agar otomatis menyesuaikan lebar layar HP & anti-zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, shrink-to-fit=no">
    <title>SONDERBREW</title>
    
    <!-- ICON HOME SCREEN -->
    <link rel="icon" type="image/png" href="https://drive.google.com/thumbnail?id=1Jc9tu0DrTnBFEU40Qy-OD5qGcXQDnpld&sz=w500">
    <link rel="apple-touch-icon" href="https://drive.google.com/thumbnail?id=1Jc9tu0DrTnBFEU40Qy-OD5qGcXQDnpld&sz=w500">
    
    <!-- PWA / FULLSCREEN SETTING -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SONDERBREW">
    <meta name="mobile-web-app-capable" content="yes">

    <style>
        /* Mengunci latar belakang agar tidak putih saat loading */
        * { box-sizing: border-box; }
        html, body { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            overflow: hidden; 
            background-color: #121212; 
        }
        /* Memaksa iframe menyesuaikan ukuran layar HP secara mutlak */
        iframe { 
            width: 100%; 
            height: 100vh; 
            height: 100dvh; /* Mendukung tinggi layar dinamis HP modern */
            border: none; 
            display: block;
            background: #121212;
        }
    </style>
</head>
<body>
    <!-- Masukkan URL Web App Apps Script Anda yang berakhiran /exec di bawah ini -->
    <iframe src="MASUKKAN_URL_APPS_SCRIPT_ANDA_DISINI" allow="geolocation"></iframe>
</body>
</html>
